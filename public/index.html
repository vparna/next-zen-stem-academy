<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NextGen STEAM Academy</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #4338CA;
      --accent: #F97316;
      --bg: #0F172A;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-badge {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #6366F1, #4F46E5, #3B82F6);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
      font-size: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94A3B8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #CBD5E1;
      margin-top: 12px;
    }
    .config-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      text-align: left;
    }
    .config-box.active {
      display: block;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94A3B8;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #FFF;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #CBD5E1;
      margin-top: 8px;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">🚀</div>
    <h1>NextGen STEAM Academy</h1>
    <p class="subtitle">Mobile Application Engine</p>

    <div id="loader-view">
      <div class="spinner"></div>
      <div id="status-message" class="status-text">Connecting to App Server...</div>
    </div>

    <div id="config-view" class="config-box">
      <label for="server-url">App Server Endpoint URL</label>
      <input type="url" id="server-url" placeholder="http://192.168.1.X:3000 or https://..." value="" />
      <button class="btn" onclick="connectToServer()">Connect to Server</button>
      <button class="btn btn-secondary" onclick="tryLocalFallback()">Retry Connection</button>
    </div>
  </div>

  <script>
    const DEFAULT_SERVER_URL = localStorage.getItem('CAPACITOR_SERVER_URL') || window.location.origin;

    function setStatus(msg) {
      document.getElementById('status-message').innerText = msg;
    }

    async function checkServer(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url + '/api/courses', { method: 'GET', signal: controller.signal });
        clearTimeout(timeoutId);
        return res.ok || res.status === 404 || res.status === 200;
      } catch (e) {
        return false;
      }
    }

    async function init() {
      const savedUrl = localStorage.getItem('CAPACITOR_SERVER_URL');
      if (savedUrl) {
        setStatus('Connecting to ' + savedUrl);
        window.location.href = savedUrl;
        return;
      }

      // Check default origin or prompt configuration
      document.getElementById('server-url').value = window.location.origin.includes('localhost') ? 'http://localhost:3000' : window.location.origin;
      
      setTimeout(() => {
        document.getElementById('loader-view').style.display = 'none';
        document.getElementById('config-view').classList.add('active');
      }, 1500);
    }

    function connectToServer() {
      let url = document.getElementById('server-url').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      url = url.replace(/\/$/, '');
      localStorage.setItem('CAPACITOR_SERVER_URL', url);
      setStatus('Redirecting to ' + url + '...');
      window.location.href = url;
    }

    function tryLocalFallback() {
      localStorage.removeItem('CAPACITOR_SERVER_URL');
      window.location.reload();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
